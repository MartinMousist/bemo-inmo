name: bemo-inmo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      # consumidas por db/init/01-app-role.sh
      APP_DB_USER: ${DB_APP_USER}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Almacenamiento S3 para dev. La API habla el MISMO protocolo que S3, R2 o
  # Spaces, así que pasar a producción es cambiar variables de entorno y no
  # código. Guardar en disco local obligaría a reescribir esta capa después.
  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - s3-data:/data
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Crea el bucket una vez y se apaga. Sin esto la primera subida falla con
  # NoSuchBucket y parece un bug de la app.
  s3-init:
    image: minio/mc:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo 'bucket listo'
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      # el rol restringido: es con el que corre la app y al que SÍ le aplica RLS
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${DB_NAME}
      # el owner: sólo lo usa el migrador
      DATABASE_OWNER_URL: postgres://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@db:5432/${DB_NAME}
      MIGRATE_ON_BOOT: "true"
      SEED_ON_BOOT: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      # Opcional: sin key la app no geocodifica y lo dice, no inventa
      # coordenadas. El `:-` evita que compose falle si no está en el .env.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # URL con la que el NAVEGADOR ve los archivos. Distinta del endpoint
      # interno: dentro de la red de compose el host es "s3", pero el browser
      # del usuario no resuelve ese nombre.
      S3_PUBLIC_URL: http://localhost:${S3_PORT:-9000}/${S3_BUCKET}
    volumes:
      - ./api:/app
      - /app/node_modules # volumen anónimo: preserva el node_modules de la imagen
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve también
      # a ::1, busybox wget prueba IPv6 primero y la app escucha en IPv4 (0.0.0.0).
      # El resultado es un "Connection refused" con la app perfectamente sana.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}/v1
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db-data:
  s3-data:
