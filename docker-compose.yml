name: bemo-inmo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      # consumidas por db/init/01-app-role.sh
      APP_DB_USER: ${DB_APP_USER}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      # el rol restringido: es con el que corre la app y al que SÍ le aplica RLS
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${DB_NAME}
      # el owner: sólo lo usa el migrador
      DATABASE_OWNER_URL: postgres://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@db:5432/${DB_NAME}
      MIGRATE_ON_BOOT: "true"
      SEED_ON_BOOT: "true"
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./api:/app
      - /app/node_modules # volumen anónimo: preserva el node_modules de la imagen
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}/v1
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db-data:
