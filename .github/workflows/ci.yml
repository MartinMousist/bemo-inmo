name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    # Postgres REAL, no un sustituto. Los tests corren las mismas migraciones
    # que producción: un schema armado a mano para CI prueba otra cosa.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bemo_inmo
          POSTGRES_USER: inmo_owner
          POSTGRES_PASSWORD: ci_owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inmo_owner -d bemo_inmo"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://inmo_app:ci_app@localhost:5432/bemo_inmo
      DATABASE_OWNER_URL: postgres://inmo_owner:ci_owner@localhost:5432/bemo_inmo
      JWT_SECRET: clave_de_ci_de_al_menos_treinta_y_dos_caracteres
      NODE_ENV: test

      # S3 real (MinIO). Sin esto, los diez tests de fotos fallan — y entre
      # ellos está el que verifica que un archivo se acepte por su FIRMA DE
      # BYTES y no por su nombre, que es el que impide subir un ejecutable
      # llamado `foto.jpg`. Un CI que no corre esos tests es un CI que da luz
      # verde a un cambio que rompe esa validación.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: bemo-inmo-ci
      S3_ACCESS_KEY: ci_s3_access
      S3_SECRET_KEY: ci_s3_secret_min8
      S3_PUBLIC_URL: http://localhost:9000/bemo-inmo-ci

    steps:
      - uses: actions/checkout@v4

      # MinIO va con `docker run` y no como `service`: la imagen necesita el
      # comando `server /data`, y los `services` de Actions no permiten
      # sobrescribir el comando — sólo el entrypoint, que acá no alcanza.
      - name: Levantar MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ci_s3_access \
            -e MINIO_ROOT_PASSWORD=ci_s3_secret_min8 \
            minio/minio:latest server /data

          # Esperar a que responda antes de crear el bucket. Sin esto, `mc`
          # corre contra un servidor que todavía no escucha y falla.
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

          # El bucket, una sola vez. Sin él la primera subida da NoSuchBucket y
          # parece un bug de la app.
          #
          # Y con la MISMA política que el compose: raíz cerrada, `publico/`
          # abierto. Sin esto el CI probaría contra un bucket con otros
          # permisos que producción, que es el agujero que ya dejó pasar la
          # falta de `helmet` en el arnés de tests (etapa 8).
          docker run --rm --network host \
            -e MC_HOST_local=http://ci_s3_access:ci_s3_secret_min8@localhost:9000 \
            minio/mc:latest mb --ignore-existing local/bemo-inmo-ci
          docker run --rm --network host \
            -e MC_HOST_local=http://ci_s3_access:ci_s3_secret_min8@localhost:9000 \
            minio/mc:latest anonymous set none local/bemo-inmo-ci
          docker run --rm --network host \
            -e MC_HOST_local=http://ci_s3_access:ci_s3_secret_min8@localhost:9000 \
            minio/mc:latest anonymous set download local/bemo-inmo-ci/publico

      # Node 20, no la última: Node 26 inyecta un localStorage experimental que
      # rompe la suite del frontend con errores que no son bugs reales.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Crear el rol restringido
        run: |
          PGPASSWORD=ci_owner psql -h localhost -U inmo_owner -d bemo_inmo -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE app_role NOLOGIN;
            CREATE ROLE inmo_app LOGIN PASSWORD 'ci_app' IN ROLE app_role;
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            GRANT CONNECT ON DATABASE bemo_inmo TO app_role;
            GRANT USAGE ON SCHEMA public TO app_role;
          SQL

      - run: npm ci
        working-directory: api

      - run: npm run migrate
        working-directory: api

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: api

      - name: Tests
        run: npm test
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx vue-tsc --noEmit
        working-directory: web
      # Antes del build: si un test falla, no tiene sentido gastar el build.
      - name: Tests
        run: npm test
        working-directory: web
      - name: Build
        run: npx vite build
        working-directory: web

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # El pre-commit se puede saltear con --no-verify; esto no.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependencias ────────────────────────────────────────────────────────────
  #
  # El gate corta en CRITICAL sobre lo que efectivamente se despacha
  # (`--omit=dev`), y el reporte de `high` se imprime sin romper el build. No es
  # laxitud: es que un gate que arranca en rojo se aprende a ignorar en una
  # semana, y entonces no avisa el día que aparece algo de verdad.
  #
  # Lo que hoy queda en `high` y por qué no bloquea, revisado uno por uno:
  #
  #   · multer (DoS) — NO ES ALCANZABLE. Esta app no parsea multipart en ningún
  #     lado: las imágenes viajan en base64 por decisión documentada en
  #     `fotos.controller.ts`. Multer entra como dependencia transitiva de
  #     `@nestjs/platform-express` y ningún controlador lo instancia.
  #   · express / body-parser vía `@nestjs/platform-express` — el fix es Nest 11
  #     y hoy el proyecto está en 10.4.22. Es una migración mayor con riesgo
  #     sobre 955 tests, así que va como su propio ítem (etapa 17.3) y no
  #     escondida adentro de un `audit fix`.
  #
  # Cuando esa migración entre, este job pasa a `--audit-level=high`.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: API · lo que se despacha
        working-directory: api
        run: |
          npm audit --omit=dev --audit-level=critical
          echo "--- high, informativo (ver el comentario del workflow) ---"
          npm audit --omit=dev --audit-level=high || true

      - name: Web · lo que se despacha
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
