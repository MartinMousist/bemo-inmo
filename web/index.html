    <!-- Open Graph: cuando alguien comparte el enlace por WhatsApp. -->
    <meta property="og:title" content="Bemo INMO — Gestión inmobiliaria" />
    <meta
      property="og:description"
      content="El alquiler se administra solo: índices, vencimientos y liquidaciones."
    />
    <meta property="og:type" content="website" />

    <!--
      Tema ANTES del primer pintado. Inline y bloqueante a propósito: como
      módulo diferido, cada carga arrancaría en claro y pegaría un destello
      blanco antes de corregirse.

      La preferencia guardada puede ser 'claro', 'oscuro' o 'sistema'. Con
      'sistema' se resuelve contra prefers-color-scheme en cada carga.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('bemo-inmo:theme') || 'sistema';
          // Compatibilidad con el formato viejo, que guardaba el tema efectivo.
          if (p === 'dark') p = 'oscuro';
          if (p === 'light') p = 'claro';
          var oscuro =
            p === 'oscuro' ||
            (p !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!--
      Tipografía de la CAPA FAMILIA BEMO, igual que en Bemo MED: General Sans
      para display, Geist para UI y Geist Mono para cifras.

      Es lo que DESIGN.md §4 tenía marcado como divergencia abierta —MED usaba
      estas tres, INMO usaba Newsreader + IBM Plex— y se resolvió adoptando las
      de MED. La tipografía es lo que más hace que dos productos se lean como
      hermanos, más aún que el color, así que no puede variar por producto.

      General Sans va por Fontshare (no está en Google Fonts); Geist y Geist
      Mono por Google Fonts. Dos orígenes, los dos con preconnect.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

  </body>
</html>
